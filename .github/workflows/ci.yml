# CI/CD de la app Android (F5-ALL-01).
# - Compilación debug + pruebas unitarias y gitleaks en cada push y PR a dev, qa y main.
#   La APK debug queda como artefacto del workflow.
# - En cada push a main compila la APK release (si existe la variable TIZON_API_BASE_URL)
#   y la publica como artefacto con su SHA-256. La firma usa los secretos TIZON_KEYSTORE_*.
name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :composeApp:assembleDebug :composeApp:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: tizon-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: composeApp/build/reports/tests/
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact -v --no-banner

  release-apk:
    # Variable del repositorio (Settings → Variables), p. ej. https://<PUBLIC_HOST>/api/
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.TIZON_API_BASE_URL != ''
    needs: [build, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar keystore (secreto en Base64, nunca en git)
        env:
          TIZON_KEYSTORE_BASE64: ${{ secrets.TIZON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TIZON_KEYSTORE_BASE64" ]; then
            echo "$TIZON_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tizon-release.jks"
            echo "TIZON_KEYSTORE_PATH=$RUNNER_TEMP/tizon-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK release
        env:
          TIZON_KEYSTORE_PASSWORD: ${{ secrets.TIZON_KEYSTORE_PASSWORD }}
          TIZON_KEY_ALIAS: ${{ secrets.TIZON_KEY_ALIAS }}
          TIZON_KEY_PASSWORD: ${{ secrets.TIZON_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.TIZON_API_BASE_URL }}
        run: ./gradlew --no-daemon :composeApp:assembleRelease "-Ptizon.apiBaseUrl=$API_BASE_URL"
      - run: |
          cd composeApp/build/outputs/apk/release
          sha256sum -- *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tizon-release-apk
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 90
